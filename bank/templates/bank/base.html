<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Simple Bank{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; min-height: 100vh; background-size: cover; background-position: center; background-attachment: fixed; }
        nav { background: #14213d; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: #fca311; text-decoration: none; margin-right: 15px; font-weight: bold; }
        .container { max-width: 700px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 8px; margin: 6px 0 14px 0; box-sizing: border-box; }
        button { background: #14213d; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        button:hover { background: #fca311; color: #14213d; }
        .danger-btn { background: #d9534f; }
        .danger-btn:hover { background: #b52b27; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
        .msg { padding: 10px; border-radius: 5px; margin-bottom: 15px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .balance { font-size: 28px; font-weight: bold; color: #14213d; }
    </style>
</head>
<body style="{% block body_style %}{% endblock %}">
    <nav>
        <div>
            <a href="{% url 'dashboard' %}">Dashboard</a>
            {% if user.is_authenticated %}
                <a href="{% url 'deposit' %}">Deposit</a>
                <a href="{% url 'withdraw' %}">Withdraw</a>
                <a href="{% url 'transfer' %}">Transfer</a>
                <a href="{% url 'transaction_history' %}">History</a>
            {% endif %}
        </div>
        <div>
            {% if user.is_authenticated %}
                <span style="color:white;">Hi, {{ user.username }}</span>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>
    <div class="container" style="{% block container_style %}{% endblock %}">
        {% for message in messages %}
            <div class="msg {% if message.tags == 'success' %}success{% else %}error{% endif %}">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
